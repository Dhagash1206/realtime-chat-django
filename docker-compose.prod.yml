name: chat-prod

x-backend: &backend
  build:
    context: .
  env_file: .env.prod
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    env_file: .env.prod
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off release step: runs before web starts, so replicas never race on migrations
  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py clear_connections"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
