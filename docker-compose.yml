services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine

  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/code
    # runserver (with daphne installed) serves HTTP + WebSockets and auto-reloads in development
    command: >
      sh -c "python manage.py migrate &&
             python manage.py clear_connections &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: web:8000
    ports:
      - "5173:5173"
    depends_on:
      - web
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep the container's installed packages, not the host's

volumes:
  postgres_data:
